<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لمسة تاب — ورقة الباركود — عرض ستاند التقييم (تجريبية)</title>
<link rel="icon" href="../../favicon.ico" sizes="32x32"><link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/brand/tokens.css">
<style>
@page{size:A4;margin:15mm}
*{box-sizing:border-box}
body{margin:0;background:#e9ecf1;color:#111;font:16px/1.6 var(--lt-font-brand)}
.page{width:210mm;min-height:297mm;max-width:100%;margin:16px auto;background:#fff;padding:20mm 15mm;text-align:center}
.logo{display:block;height:18mm;width:auto;margin:0 auto 8mm}
h1{font-size:28px;margin:0 0 6mm}
#qr{width:110mm;max-width:100%;margin:0 auto}
#qr svg{width:100%;height:auto;display:block}
.lines p{font-size:20px;margin:6mm 0 0}
.url{direction:ltr;font-family:monospace;font-size:14px;color:#333;word-break:break-all;margin-top:8mm}
.warn{margin-top:10mm;font-size:14px;color:#6b4a00;border:1px dashed #b58900;padding:3mm;border-radius:3mm}
.err{color:#b00020}
@media print{body{background:#fff}.page{margin:0;width:auto;min-height:0;padding:0}.noprint{display:none}}
</style>
</head>
<body>
<div class="page">
<img class="logo" src="../../assets/brand/lamsatap-horizontal.svg" width="141" height="48" alt="لمسة تاب — LamsaTap">
<h1>امسح وشوف وش يشوفه زبونك</h1>
<div id="qr" role="img" aria-label="باركود QR لرابط صفحة العرض"></div>
<div class="lines">
<p>امسح الباركود بكاميرا جوالك.</p>
<p>تفتح لك صفحة مثال لستاند تقييم قوقل.</p>
</div>
<p class="url" id="url"></p>
<p class="warn">ورقة تجريبية — الرابط يتغير لما يجي الدومين.</p>
</div>
<script src="../../config.js"></script>
<script src="config.js"></script>
<script src="../../vendor/qrcode-generator.js"></script>
<script>
(function(){
var u=window.DEMO_URL||'';document.getElementById('url').textContent=u;
var box=document.getElementById('qr');
if(!u||typeof qrcode!=='function'){box.innerHTML='<p class="err">تعذر توليد الباركود (تأكد من config.js ووجود vendor/qrcode-generator.js).</p>';return;}
var q=qrcode(0,'M');q.addData(u);q.make();
box.innerHTML=q.createSvgTag({cellSize:8,margin:4,scalable:true});
})();
</script>
</body>
</html>
