<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>روابطنا</title>
<link rel="icon" href="../../favicon.ico" sizes="32x32"><link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/brand/tokens.css">
<link rel="stylesheet" href="../../assets/site.css">
</head>
<body>
<main>
<span class="tag" id="demo" hidden>عرض تجريبي — محل مثال وليس محلاً حقيقياً</span>
<section class="card" style="text-align:center">
<h1 id="name"></h1>
<p class="muted" id="tagline" hidden></p>
<div id="list"></div>
<p class="status" id="empty" hidden>في العرض التجريبي الأزرار بدون روابط. في النسخة الحقيقية يفتح كل زر حساب المحل.</p>
</section>
<footer class="by"><img src="../../assets/brand/favicon.svg" width="18" height="18" alt=""> بواسطة <span data-company>لمسة تاب</span></footer>
</main>
<script src="../../config.js"></script>
<script src="../../assets/app.js"></script>
<script src="data.js"></script>
<script>
(function(){
var D=window.LINKS_DATA||{links:[]},e=window.esc,h='',missing=false;
document.getElementById('demo').hidden=!D.demo;
document.getElementById('name').textContent=D.name||'';
if(D.tagline){var t=document.getElementById('tagline');t.textContent=D.tagline;t.hidden=false;}
(D.links||[]).forEach(function(k){
  var ok=/^https:\/\/[^\s"'<>]+$/.test(k.url||'');
  if(ok)h+='<a class="btn" href="'+e(k.url)+'" rel="noopener">'+e(k.label)+'</a>';
  else if(D.demo){h+='<a class="btn" aria-disabled="true">'+e(k.label)+'</a>';missing=true;}
});
document.getElementById('list').innerHTML=h;
document.getElementById('empty').hidden=!missing;
})();
</script>
</body>
</html>
